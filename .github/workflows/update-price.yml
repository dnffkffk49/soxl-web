name: SOXL 종가 자동 갱신

on:
  schedule:
    # 매주 월~금 UTC 21:30 (미국 뉴욕증권거래소 정규장 마감 30분~1시간 뒤, 서머타임 상관없이 안전한 시간)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}   # 필요하면 GitHub 저장소의 Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 종가 조회
        run: node scripts/fetch-price.mjs

      - name: 변경 사항 커밋
        run: |
          git config user.name "soxl-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 종가 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
